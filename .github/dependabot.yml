version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint pins its peer range to `typescript >=4.8.4 <6.1.0`,
      # so a major TypeScript bump makes `npm ci` fail on peer resolution
      # before a single test runs. Drop this entry once typescript-eslint
      # supports the newer major; until then the PR can only ever be red.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per ecosystem bump keeps review noise low on a solo project.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
